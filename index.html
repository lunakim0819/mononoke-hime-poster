<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>모노노케 히메</title>
  <link rel="stylesheet" href="./css/reset.css">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="poster">

    <!-- 처음 숲 부분 정령 배치-->
    <div class="intro">
      <img class="forest" src="./asset/forest.png" alt="깊은 숲">
      <div class="spirits">
        <img class="spirit spirit-1" src="./asset/kodama-1.png" alt="정령">
        <img class="spirit spirit-2" src="./asset/kodama-2.png" alt="정령">
        <img class="spirit spirit-3" src="./asset/kodama-3.png" alt="정령">
        <img class="spirit spirit-4" src="./asset/kodama-4.png" alt="정령">
        <img class="spirit spirit-5" src="./asset/kodama-5.png" alt="정령">
      </div>
    </div>

    <!-- 산에서 아시타카로 카메라 구도 이동 -->
    <div class="story">
      <div class="camera">
        <img class="long-night-bg" src="./asset/night-forest.png" alt="밤 숲">

        <div class="scene san-scene">
          <img class="character san-character" src="./asset/san-cutout.png" alt="칼을 든 산">
          <p class="dialogue live">살아라…</p>
        </div>

        <div class="scene ashitaka-scene">
          <img class="character ashitaka-character" src="./asset/ashitaka-cutout.png" alt="아시타카">
          <img class="blade" src="./asset/blade.png" alt="칼날">
          <p class="dialogue beautiful">그대는 아름답다.</p>
        </div>
      </div>
    </div>

    <!-- 산이 늑대를 치료하는 장면 -->
    <div class="healing">
      <img class="healing-bg" src="./asset/healing-forest.png" alt="숲">
      <img class="healing-pair" src="./asset/san-wolf-cutout.png" alt="늑대를 돌보는 산">
    </div>

    <div class="bright-scene">
      <img class="bright-forest" src="./asset/forest.png" alt="밝은 숲">
      <img class="bright-wolf" src="./asset/wolf.png" alt="흰 늑대">
      <img class="bright-san" src="./asset/san.png" alt="산">
    </div>

    <!-- 모노노케히메 제목과 개봉일 -->
    <div class="title-scene">
      <div class="title-content">
        <p class="final-director">미야자키 하야오 감독 작품</p>
        <div class="title-reveal">
          <img class="final-title" src="./asset/title.png" alt="모노노케 히메">
        </div>
        <p class="final-release">9월 17일 대개봉</p>
      </div>

      <button class="restart" type="button" aria-label="처음부터 다시 보기">
        <img src="./asset/kodama-1.png" alt="">
      </button>
    </div>

  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="./js/script.js"></script>
</body>
</html>
